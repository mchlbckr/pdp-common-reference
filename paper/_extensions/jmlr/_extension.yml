title: Journal of Machine Learning Research
author: Michael Buecker
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    pdf:
      documentclass: article
      pdf-engine: pdflatex
      indent: true
      cite-method: natbib
      biblio-config: false
      colorlinks: true
      linkcolor: black
      citecolor: black
      urlcolor: black
      number-sections: true
      shift-heading-level-by: -1
      keep-tex: true
      template-partials:
        - partials/doc-class.tex
        - partials/title.tex
        - partials/before-body.tex
      format-resources:
        - jmlr2e.sty
